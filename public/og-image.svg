<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Decorative dots -->
  <circle cx="100" cy="100" r="3" fill="#333"/>
  <circle cx="200" cy="150" r="2" fill="#333"/>
  <circle cx="1100" cy="100" r="3" fill="#333"/>
  <circle cx="1000" cy="180" r="2" fill="#333"/>
  <circle cx="150" cy="500" r="2" fill="#333"/>
  <circle cx="1050" cy="520" r="3" fill="#333"/>
  
  <!-- Clock cards container -->
  <g transform="translate(180, 180)" filter="url(#shadow)">
    <!-- Hour 1 -->
    <rect x="0" y="0" width="120" height="180" rx="12" fill="#f5f5f5"/>
    <line x1="0" y1="90" x2="120" y2="90" stroke="#000" stroke-width="2" opacity="0.1"/>
    <text x="60" y="130" font-family="Arial Black, sans-serif" font-size="120" font-weight="900" text-anchor="middle" fill="#1a1a1a">1</text>
    
    <!-- Hour 2 -->
    <rect x="135" y="0" width="120" height="180" rx="12" fill="#f5f5f5"/>
    <line x1="135" y1="90" x2="255" y2="90" stroke="#000" stroke-width="2" opacity="0.1"/>
    <text x="195" y="130" font-family="Arial Black, sans-serif" font-size="120" font-weight="900" text-anchor="middle" fill="#1a1a1a">2</text>
    
    <!-- Colon -->
    <text x="295" y="110" font-family="Arial Black, sans-serif" font-size="80" font-weight="900" fill="#555">:</text>
    
    <!-- Minute 1 -->
    <rect x="330" y="0" width="120" height="180" rx="12" fill="#f5f5f5"/>
    <line x1="330" y1="90" x2="450" y2="90" stroke="#000" stroke-width="2" opacity="0.1"/>
    <text x="390" y="130" font-family="Arial Black, sans-serif" font-size="120" font-weight="900" text-anchor="middle" fill="#1a1a1a">3</text>
    
    <!-- Minute 2 -->
    <rect x="465" y="0" width="120" height="180" rx="12" fill="#f5f5f5"/>
    <line x1="465" y1="90" x2="585" y2="90" stroke="#000" stroke-width="2" opacity="0.1"/>
    <text x="525" y="130" font-family="Arial Black, sans-serif" font-size="120" font-weight="900" text-anchor="middle" fill="#1a1a1a">4</text>
    
    <!-- Colon -->
    <text x="625" y="110" font-family="Arial Black, sans-serif" font-size="80" font-weight="900" fill="#555">:</text>
    
    <!-- Second 1 -->
    <rect x="660" y="0" width="120" height="180" rx="12" fill="#f5f5f5"/>
    <line x1="660" y1="90" x2="780" y2="90" stroke="#000" stroke-width="2" opacity="0.1"/>
    <text x="720" y="130" font-family="Arial Black, sans-serif" font-size="120" font-weight="900" text-anchor="middle" fill="#1a1a1a">5</text>
    
    <!-- Second 2 -->
    <rect x="795" y="0" width="120" height="180" rx="12" fill="#f5f5f5"/>
    <line x1="795" y1="90" x2="915" y2="90" stroke="#000" stroke-width="2" opacity="0.1"/>
    <text x="855" y="130" font-family="Arial Black, sans-serif" font-size="120" font-weight="900" text-anchor="middle" fill="#1a1a1a">6</text>
  </g>
  
  <!-- Title -->
  <text x="600" y="480" font-family="system-ui, sans-serif" font-size="36" font-weight="600" text-anchor="middle" fill="#ffffff">
    Saurav's Minimalist Clock
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="520" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle" fill="#888888">
    Clock • Stopwatch • Timer • Multiple Themes
  </text>
  
  <!-- URL -->
  <text x="600" y="580" font-family="monospace" font-size="18" text-anchor="middle" fill="#666666">
    clock.sauravgo.fun
  </text>
</svg>
